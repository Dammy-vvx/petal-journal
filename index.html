<style>
:root{color-scheme:light;--baby:#fcb8da;--bg:#FCEAF2;--card:#FFF7FA;--tx:#3B1428;--tx2:#7B4F63;--bd:#E5C3D4;--brand:#b51264;--btn:#b51264;--btnTx:#FFF6FA;--a:#D95787;--s:#FCE4ED;--d:#A82D5B;--headTx:#8F0F50;--navTx:#5A0B31;--headBd:#d98bad;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;transition:background-color .25s,color .25s,border-color .25s}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.5 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--baby);z-index:10}
h1,h2,h3,.serif{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-weight:600;margin:0}
header{background:var(--baby);padding:22px 20px 0}
/* Compact, centered app-lock panel. */
body.auth-screen{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:#fff8fb;color:#351526}
body.auth-screen::before{display:none}
body.auth-screen header{display:none}
body.auth-screen main{width:100%;max-width:500px;margin:0;padding:0;background:transparent;border:0;border-radius:0;min-height:0}
.auth-wrap{width:100%;max-width:500px;margin:0 auto;background:#fceaf2;border:1px solid #f0cddd;border-radius:22px;padding:26px 26px 22px;box-shadow:0 18px 55px rgba(91,24,57,.12)}
.auth-brand{font:400 16px/1.2 "DM Sans",system-ui,sans-serif;color:#a20d57;text-transform:uppercase;letter-spacing:.02em;margin-bottom:12px}
.auth-wrap h2{font:700 27px/1.2 "DM Sans",system-ui,sans-serif;color:#a20d57;margin-bottom:7px;letter-spacing:-.025em}
.auth-subtitle{font-size:15px;color:#80556a;margin-bottom:18px}
.auth-form{background:#fff7fa;border-radius:14px;padding:18px 18px 16px}
.auth-form label{display:block;font-size:14px;font-weight:700;color:#3b1428;margin:0 0 6px}
.auth-form input{display:block;width:100%;height:44px;padding:10px 12px;margin:0 0 13px;border:1px solid #e5cbd7;border-radius:9px;background:#fff;color:#3b1428;font-size:15px}
.auth-form input::placeholder{color:#a28c96;opacity:1}
.auth-form .btn{display:block;width:100%;min-height:45px;margin:4px 0 8px;border:0;border-radius:9px;background:#b51264;color:#fff;font-size:15px;font-weight:700}
.auth-form .ghost{display:block;width:100%;min-height:38px;margin:6px 0 0;border-radius:9px;font-size:13px}
.auth-note{font-size:11px;line-height:1.45;color:#80556a;margin:12px 2px 0}
.auth-form .msg{font-size:13px;margin:0 0 10px}
@media(max-width:600px){body.auth-screen{padding:16px 12px}.auth-wrap{padding:22px 16px 18px;border-radius:18px}.auth-brand{font-size:14px;margin-bottom:10px}.auth-wrap h2{font-size:24px}.auth-subtitle{font-size:14px;margin-bottom:14px}.auth-form{padding:16px 13px 13px}.auth-form label{font-size:13px}.auth-form input{height:43px;font-size:15px;margin-bottom:12px}.auth-form .btn{min-height:44px;font-size:15px}.auth-note{font-size:10px}}
@media(prefers-color-scheme:dark){
 body.auth-screen{background:#171219;color:#f8eaf1}
 body.auth-screen main{background:transparent}
 .auth-wrap{background:#2a1d28;border-color:#56354b;box-shadow:0 18px 55px rgba(0,0,0,.35)}
 .auth-brand,.auth-wrap h2{color:#ff9acb}
 .auth-subtitle,.auth-note{color:#d4afc3}
 .auth-form{background:#211720}
 .auth-form label{color:#f7e5ee}
 .auth-form input{background:#171219;color:#fff0f7;border-color:#604157}
 .auth-form input::placeholder{color:#b69baa}
 .auth-form .ghost{color:#ffd6e9;border-color:#79516a;background:transparent}
}
header h1{font-size:34px;color:var(--headTx);max-width:720px;margin:0 auto}#greeting{max-width:720px;margin:0 auto;color:var(--navTx);font-size:14px;padding-top:2px}#logout{display:block;margin:6px auto 0;max-width:720px;color:var(--navTx);border-color:var(--headBd)}#logout[hidden]{display:none}.auth-wrap{max-width:none;margin:0 auto}.auth-wrap h2{margin-bottom:8px}.auth-wrap input{width:100%;margin-bottom:12px}.auth-wrap .btn,.auth-wrap .ghost{margin-top:4px}.auth-note{font-size:13px;color:#80556a}
nav{display:flex;gap:4px;max-width:720px;margin:10px auto 0}

.card{background:var(--card);border:1px solid var(--bd);border-radius:2px;padding:20px;margin-bottom:16px}

h2{font-size:28px;color:var(--brand)}h3{font-size:22px;color:var(--brand)}
p{margin:0 0 10px}.sub{color:var(--tx2);font-size:14px}
.btn,.ghost{font:500 15px "DM Sans",sans-serif;padding:12px 18px;min-height:44px;border-radius:2px;cursor:pointer;margin:0 8px 8px 0}
.btn{background:var(--btn);color:var(--btnTx);border:1px solid var(--btn)}
.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
input,select,textarea{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:2px;padding:10px;font:inherit;min-height:44px;max-width:100%}
textarea{width:100%;min-height:90px}
.ringbox{position:relative;width:224px;height:224px;margin:0 auto 12px}
.ringbox svg{width:100%;height:100%}
.ringc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ringc .n{font:600 70px/1 "Cormorant Garamond",Georgia,serif;color:var(--brand)}
.badge{display:inline-block;background:var(--s);color:var(--d);border:1px solid var(--a);padding:4px 12px;border-radius:2px;font-weight:700;font-size:14px}
dl{margin:0}dl div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--bd)}
dt{color:var(--tx2)}dd{margin:0;text-align:right;font-weight:500}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.seg button{flex:1 1 auto;min-height:44px;padding:8px 12px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:2px;font:500 14px "DM Sans",sans-serif;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--s);border-color:var(--a);color:var(--d);font-weight:700}
.chips button{flex:0 0 auto}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.wd{font-size:12px;color:var(--tx2);text-align:center;padding:4px 0}
.day{position:relative;min-height:46px;border:1px solid transparent;background:var(--card);color:var(--tx);font:500 15px "DM Sans",sans-serif;border-radius:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:2px}
.day small{font-size:10px;color:var(--tx2);line-height:1}
.day.conf{background:var(--btn);color:var(--btnTx)}.day.conf small{color:inherit}
.day.pred{border:1px dashed var(--d)}
.day.today{outline:2px solid var(--brand);outline-offset:-2px}
.day.sel{border:2px solid var(--d)}
.day.fert{border-bottom:3px solid var(--a)}
.day.out{opacity:.35}
.day.lg::after{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;background:var(--brand)}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--tx2);margin-top:12px}
.leg span i{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:5px;border:1px solid var(--bd)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--bd);flex-wrap:wrap}
.row .acts{display:flex;gap:6px}.row .acts button{margin:0;padding:8px 12px;min-height:40px}
.flag{color:var(--d);font-size:13px;font-weight:500}
.msg{background:var(--s);border:1px solid var(--a);color:var(--tx);padding:10px 14px;border-radius:2px;margin-bottom:14px}
label{display:block;margin-bottom:6px;font-weight:500}
.mt{margin-top:14px}
</style>
</head>
<body>
<header><h1>Petal Journal</h1><p id="greeting" hidden></p><button id="logout" class="ghost" data-act="logout" hidden>Log out</button><nav id="nav" aria-label="Sections"></nav></header>
<main id="app"></main>
<script>
"use strict";
let KEY="petal.v1";
const USERS_KEY="petal.users.v1", SESSION_KEY="petal.session.v1";
let authUser=null, authName="", authMode="login", authMsg="";
const PH={
menstrual:{n:"Menstrual",l:"M",a:"#D95787",s:"#FCE4ED",d:"#A82D5B",ds:"#4A2233",dd:"#F08FB1",mood:"Warm, gentle, reassuring.",tip:"Bleeding days. Many people prefer slower days and extra rest."},
follicular:{n:"Follicular",l:"F",a:"#D98BAF",s:"#F9E8F0",d:"#9D416D",ds:"#432636",dd:"#E8A9C6",mood:"Fresh, light, renewed.",tip:"Energy often rises as the next ovulation approaches."},
ovulatory:{n:"Ovulatory",l:"O",a:"#E89A91",s:"#FCEBE5",d:"#A84F64",ds:"#4A2B2B",dd:"#F2B3AB",mood:"Bright, warm, luminous.",tip:"An estimated window around ovulation. A calendar cannot confirm it."},
luteal:{n:"Luteal",l:"L",a:"#AD83A7",s:"#F0E7F0",d:"#704765",ds:"#3B2B3B",dd:"#CFA9CA",mood:"Calm, muted, grounded.",tip:"The days before the next period. Some people notice mood or energy shifts."}};
const SYM=["Cramps","Headache","Bloating","Fatigue","Mood shift","Tender breasts","Acne","Cravings"];
const FLOW=["None","Spotting","Light","Medium","Heavy"];
const def=()=>({pl:5,starts:[],logs:{},ok:{},fert:false,appear:"light",lockMin:2});
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* date helpers: calendar arithmetic on local dates, never elapsed milliseconds */
const P=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const F=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const U=s=>{const[a,b,c]=s.split("-").map(Number);return Math.round(Date.UTC(a,b-1,c)/864e5)};
const diff=(a,b)=>U(b)-U(a);
const add=(s,n)=>{const d=P(s);return F(new Date(d.getFullYear(),d.getMonth(),d.getDate()+n))};
const valid=s=>typeof s==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&F(P(s))===s;
const today=()=>F(new Date());
const fmt=(s,o)=>P(s).toLocaleDateString(undefined,o||{month:"short",day:"numeric"});
const fmtL=s=>fmt(s,{weekday:"short",month:"short",day:"numeric",year:"numeric"});

let S=def(),KEYOBJ=null,locked=false,pending=null,lockMsg="",fails=0,until=0,q=Promise.resolve(),idle,hiddenAt=0,tab="today",view=null,sheet=null,msg="",draft=null,sel=null,editing=null,sure=false;
let cal={y:new Date().getFullYear(),m:new Date().getMonth()};
const norm=o=>o&&Array.isArray(o.starts)?Object.assign(def(),o,{starts:[...new Set(o.starts.filter(valid))].sort()}):def();
/* ---------- security: AES-GCM encryption with a PBKDF2 passcode key ---------- */
const b64=u=>btoa(String.fromCharCode(...u)),unb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pw,salt){const m=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:310000,hash:"SHA-256"},m,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function passwordVerifier(password,salt){
 const material=await crypto.subtle.importKey("raw",new TextEncoder().encode(password),"PBKDF2",false,["deriveBits"]);
 return b64(new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:310000,hash:"SHA-256"},material,256)));
}
function users(){try{const u=JSON.parse(localStorage.getItem(USERS_KEY)||"{}");return u&&typeof u==="object"?u:{}}catch(e){return {}}}
function authView(){
 const create=authMode==="create";
 return `<section class="auth-wrap" aria-labelledby="auth-title">
 <div class="auth-brand">Petal Journal</div>
 <h2 id="auth-title">Welcome to your little corner 🌸</h2>
 <p class="auth-subtitle">Your cycle, your space, your journal.</p>
 <div class="auth-form">
 ${authMsg?`<p class="msg" role="alert">${esc(authMsg)}</p>`:""}
 ${create?`<label for="displayName">Your name</label><input id="displayName" autocomplete="name" maxlength="50" placeholder="What should we call you?" value="${esc(authDraft.displayName||"")}">`:""}
 <label for="username">Username</label><input id="username" autocomplete="username" maxlength="24" autocapitalize="none" spellcheck="false" placeholder="${create?"Choose a username":"Enter your username"}" value="${esc(authDraft.username||"")}">
 <label for="${create?"createPassword":"loginPassword"}">Password</label><input id="${create?"createPassword":"loginPassword"}" type="password" autocomplete="${create?"new-password":"current-password"}" placeholder="${create?"At least 8 characters":"Enter your password"}">
 ${create?`<label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Enter your password again">`:""}
 <button class="btn" data-act="${create?"auth-create":"auth-login"}">${create?"Create account":"Log in"}</button>
 <button class="ghost" data-act="auth-switch">${create?"I already have an account":"New here? Create an account"}</button>
 </div>
 <p class="auth-note">Your account and journal stay on this device. No cloud account or sync.</p>
 </section>`;
}
let authDraft={username:"",displayName:""};
async function authAction(action){
 if(action==="auth-switch"){authMode=authMode==="login"?"create":"login";authMsg="";render();return}
 if(action==="logout"){
  await q;clearTimeout(idle);KEYOBJ=null;locked=false;pending=null;localStorage.removeItem(SESSION_KEY);authUser=null;authName="";KEY="petal.v1";S=def();authMode="login";authMsg="";authDraft={username:"",displayName:""};render();return;
 }
 const username=(($("#username")||{}).value||"").trim().toLowerCase();
 authDraft.username=username;
 authDraft.displayName=(($("#displayName")||{}).value||"").trim();
 const password=(($("#"+(authMode==="create"?"createPassword":"loginPassword"))||{}).value||"");
 if(!(window.crypto&&crypto.subtle)){authMsg="This browser does not support secure password processing. Open the app in a modern browser.";render();return}
 if(!/^[a-z0-9_.-]{3,24}$/.test(username)){authMsg="Username must be 3–24 characters: lowercase letters, numbers, dots, underscores or hyphens.";render();return}
 const all=users();
 try{
  if(action==="auth-create"){
   const displayName=(($("#displayName")||{}).value||"").trim();
   const confirm=(($("#confirmPassword")||{}).value||"");
   if(!displayName){authMsg="Enter the name you want to see in your greeting.";render();return}
   if(password.length<8){authMsg="Use a password with at least 8 characters.";render();return}
   if(password!==confirm){authMsg="The passwords do not match.";render();return}
   if(all[username]){authMsg="That username already exists on this device. Choose another or log in.";render();return}
   const salt=crypto.getRandomValues(new Uint8Array(16));
   all[username]={name:displayName,salt:b64(salt),verifier:await passwordVerifier(password,salt)};
   localStorage.setItem(USERS_KEY,JSON.stringify(all));
   authUser=username;authName=displayName;KEY="petal.v1.user."+username;localStorage.setItem(SESSION_KEY,username);
   const old=localStorage.getItem("petal.v1");
   if(old&&!localStorage.getItem(KEY))localStorage.setItem(KEY,old);
   let o=null;try{o=JSON.parse(localStorage.getItem(KEY))}catch(e){}
   if(o&&o.enc){locked=true;pending=o;S=def()}else{S=norm(o);S.appear="light";sel=today()}
   authMsg="";tab="today";render();return;
  }
  if(!all[username]){authMsg="No account with that username exists on this device.";render();return}
  const salt=unb(all[username].salt),verifier=await passwordVerifier(password,salt);
  if(verifier!==all[username].verifier){authMsg="Incorrect username or password.";render();return}
  authUser=username;authName=all[username].name||username;KEY="petal.v1.user."+username;localStorage.setItem(SESSION_KEY,username);
  let o=null;try{o=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(o&&o.enc){locked=true;pending=o;S=def()}else{locked=false;pending=null;S=norm(o);S.appear="light";sel=today()}
  authMsg="";tab="today";render();
 }catch(e){authMsg="Could not process this request. Please try again.";render()}
}

async function enc(k){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},k.key,new TextEncoder().encode(JSON.stringify(S))));return JSON.stringify({enc:1,salt:k.salt,iv:b64(iv),ct:b64(ct)})}
async function setKey(p){const salt=crypto.getRandomValues(new Uint8Array(16));KEYOBJ={key:await derive(p,salt),salt:b64(salt)};save();bump()}
async function verify(pw){await q;const o=JSON.parse(localStorage.getItem(KEY));await crypto.subtle.decrypt({name:"AES-GCM",iv:unb(o.iv)},await derive(pw,unb(o.salt)),unb(o.ct))}
function bump(){clearTimeout(idle);if(KEYOBJ)idle=setTimeout(lock,S.lockMin*60000)}
async function lock(){await q;if(!KEYOBJ)return;let o=null;try{o=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!o||!o.enc)return;pending=o;S=def();KEYOBJ=null;locked=true;view=null;sheet=null;draft=null;msg="";render()}
async function unlock(pw){
 const w=until-Date.now();
 if(w>0){lockMsg="Too many attempts. Try again in "+Math.ceil(w/1000)+" seconds.";render();return}
 try{const salt=unb(pending.salt),key=await derive(pw,salt),pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb(pending.iv)},key,unb(pending.ct));
  S=norm(JSON.parse(new TextDecoder().decode(pt)));KEYOBJ={key,salt:pending.salt};locked=false;fails=0;lockMsg="";sel=today();bump()}
 catch(e){fails++;lockMsg="Incorrect passcode.";if(fails>=5)until=Date.now()+Math.min(300,30*2**(fails-5))*1000}
 render()}
async function aact(a){
 msg="";const g=id=>($(id)||{}).value||"";
 if(!(window.crypto&&crypto.subtle)&&a!=="lockNow"){msg="This browser does not support encryption.";render();return}
 try{
  if(a==="setpw"){const p=g("#np");if(p.length<8)msg="Use at least 8 characters.";else if(p!==g("#np2"))msg="The passcodes do not match.";else{await setKey(p);msg="Passcode lock is on. Your data is now encrypted."}}
  else if(a==="chpw"||a==="rmpw"){await verify(g("#cp"));if(a==="rmpw"){KEYOBJ=null;clearTimeout(idle);save();msg="Passcode removed. Data is stored without encryption."}else{const p=g("#np");if(p.length<8)msg="Use at least 8 characters.";else{await setKey(p);msg="Passcode changed."}}}
  else if(a==="lockNow"){await lock();return}
  else if(a==="unlock"){await unlock(g("#pw"));return}
 }catch(e){msg="That passcode is incorrect."}
 render()}
function secCard(){
 const on=!!KEYOBJ;
 return`<div class="card tint"><h2>Security</h2><p class="sub">${on?`Passcode lock is on. Your data is encrypted on this device with AES-256. The app locks after ${S.lockMin} minute${S.lockMin>1?"s":""} of inactivity, or when you leave it for 30 seconds.`:"Turn on a passcode to encrypt your data on this device. Without it, anyone who opens this app on your phone can read your entries."}</p>`+
 (on?`<label for="cp">Current passcode</label><input id="cp" type="password" autocomplete="current-password"><label for="np" class="mt">New passcode (only when changing it)</label><input id="np" type="password" autocomplete="new-password"><div class="mt"><button class="btn" data-act="chpw">Change passcode</button><button class="ghost" data-act="rmpw">Remove passcode</button><button class="ghost" data-act="lockNow">Lock now</button></div><label for="lm">Auto-lock after</label><select id="lm" data-chg="lockMin">${[1,2,5,15].map(v=>`<option value="${v}" ${S.lockMin===v?"selected":""}>${v} minute${v>1?"s":""}</option>`).join("")}</select>`
 :`<label for="np">New passcode (8 or more characters)</label><input id="np" type="password" autocomplete="new-password"><label for="np2" class="mt">Repeat passcode</label><input id="np2" type="password" autocomplete="new-password"><div class="mt"><button class="btn" data-act="setpw">Turn on passcode lock</button></div>`)+

function engine(){

 for(let i=1;i<s.length;i++)lens.push({a:s[i-1],b:s[i],n:diff(s[i-1],s[i])});
 const ls=lens.map(x=>x.n),use=ls.length>=7?ls.slice(-6):ls;

 const sd=use.length>1?Math.sqrt(use.reduce((a,b)=>a+(b-avg)**2,0)/(use.length-1)):0;

 const phaseOf=d=>d<=pl?"menstrual":d<ovS?"follicular":d<=ovE?"ovulatory":"luteal";

 let c=!use.length||use.length<3?0:(use.length>=6&&sd<=3)?2:(sd>5?0:1);
 const stale=!!last&&diff(last,t)>L*1.5;
 if(stale)c=Math.max(0,c-1);

 const info=d=>{
  if(!last||d<s[0])return null;
  let b=null;for(const x of s)if(x<=d)b=x;
  let day=diff(b,d)+1,proj=false,over=false;
  if(b===last&&d>=np){
   if(np>t){day=diff(last,d)%L+1;proj=true}
   else if(d>t)return null;else over=true}
  const p=over?"luteal":phaseOf(day),fut=d>t;
  return{p,day,over,conf:p==="menstrual"&&!proj&&!fut,pred:(p==="menstrual"&&(proj||fut))||(d===np&&np===t),fert:S.fert&&!over&&day>=ov-5&&day<=ov+1};
 };
 let od=null;
 if(last){const o1=add(last,ov-1);if(o1>=t)od=o1;else if(np>=t)od=add(last,L+ov-1)}
